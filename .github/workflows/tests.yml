name: tests

on:
  push:
  pull_request:

defaults:
  run:
    shell: bash

jobs:
  backend:
    runs-on: ubuntu-latest
    services:
      postgres:
        image: postgres:17
        env:
          POSTGRES_DB: security_lab_test
          POSTGRES_USER: security_lab
          POSTGRES_PASSWORD: ci-only-password
        ports:
          - 5432:5432
        options: >-
          --health-cmd "pg_isready -U security_lab -d security_lab_test"
          --health-interval 2s
          --health-timeout 3s
          --health-retries 15
    env:
      TEST_DATABASE_URL: postgresql://security_lab:ci-only-password@localhost:5432/security_lab_test
    steps:
      - uses: actions/checkout@v5
      - uses: actions/setup-python@v6
        with:
          python-version: "3.13"
          cache: pip
      - run: python -m pip install -e '.[dev]'
      - run: python -m scripts.migrate --database-url-env TEST_DATABASE_URL
      # The database suites skip when PostgreSQL is unreachable; in CI a skip is a failure.
      - run: |
          python -m pytest -rs | tee pytest.log
          if grep -q skipped pytest.log; then exit 1; fi

  frontend:
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: frontend
    steps:
      - uses: actions/checkout@v5
      - uses: actions/setup-node@v5
        with:
          node-version: "24"
          cache: npm
          cache-dependency-path: frontend/package-lock.json
      - run: npm ci
      - run: npm test
      - run: npm run typecheck
      - run: npm run build
