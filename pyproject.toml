[build-system]
requires = ["setuptools>=68"]
build-backend = "setuptools.build_meta"

[project]
name = "security-monitoring-lab"
version = "0.1.0"
description = "Portfolio security event parsing, detection, and investigation lab"
requires-python = ">=3.10"
dependencies = [
    "fastapi>=0.141,<1",
    "psycopg[binary]>=3.2,<4",
    "python-dotenv>=1,<2",
    "uvicorn>=0.30,<1",
]

[project.optional-dependencies]
dev = [
    "httpx2>=2.13,<3",
    "pytest>=8,<9",
]

[tool.setuptools.packages.find]
include = ["backend*", "detections*", "scripts*", "security_events*"]

[tool.setuptools.package-data]
backend = ["migrations/*.sql"]

[tool.pytest.ini_options]
testpaths = ["tests"]
addopts = "-q"
